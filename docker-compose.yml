services:
  postgres:
    image: postgres:16
    container_name: mymoney-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-mymoney}
      POSTGRES_USER: ${POSTGRES_USER:-mymoney_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      # Loopback only: nothing outside this machine needs direct DB access.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-mymoney_user} -d ${POSTGRES_DATABASE:-mymoney}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: mymoney-web
    restart: unless-stopped
    # Source is bind-mounted so edits reload live (runserver auto-reload).
    volumes:
      - .:/app
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    environment:
      # Inside the compose network Django reaches Postgres by its service name.
      # This overrides POSTGRES_HOST from .env (127.0.0.1, used when running
      # Django directly on the host); all other settings still load from .env.
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
