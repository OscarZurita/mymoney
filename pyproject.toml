# Tool configuration only; this project is not an installable package.

[tool.ruff]
target-version = "py312"
# Generated by Django's makemigrations; not hand-edited.
extend-exclude = ["money_app/migrations"]

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F) plus import sorting (I), bugbear (B) and
# Django-specific checks (DJ).
select = ["E4", "E7", "E9", "F", "I", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ modules exist to re-export their submodules' names.
"__init__.py" = ["F401"]
